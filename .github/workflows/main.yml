# CI/CD pipeline: build → push to Docker Hub → deploy to Cloud Run
# GCP authentication uses Workload Identity Federation (no long-lived credentials).
# Docker Hub authentication uses DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets.

name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'

env:
  GCP_PROJECT: future-gadget-labs-483502
  GCP_REGION: us-central1
  SERVICE_NAME: collection-showcase
  DOCKER_IMAGE: philwin/collection-showcase

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --cache-from type=registry,ref=${{ env.DOCKER_IMAGE }}:cache \
            --cache-to   type=registry,ref=${{ env.DOCKER_IMAGE }}:cache,mode=max \
            --tag ${{ env.DOCKER_IMAGE }}:${{ github.sha }} \
            --tag ${{ env.DOCKER_IMAGE }}:latest \
            --push .

      - name: Deploy to Cloud Run
        run: |
          gcloud run services update ${{ env.SERVICE_NAME }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT }} \
            --image=docker.io/${{ env.DOCKER_IMAGE }}:${{ github.sha }} \
            --update-secrets="GITHUB_TOKEN=github-data-sync-pat:latest"

      - name: Update data sync job image
        run: |
          gcloud run jobs update collection-showcase-data-sync \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT }} \
            --image=docker.io/${{ env.DOCKER_IMAGE }}:${{ github.sha }}
